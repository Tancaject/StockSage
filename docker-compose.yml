# StockSage 自有基础设施：MySQL、Redis、Ollama。
# 现有 D:\milvus Compose 和 attu 容器由 infra.ps1 统一调用，不在这里重复定义。
# Java backend、Python data-service、Vue frontend 和 IBKR 继续在宿主机运行。

services:
  mysql:
    image: mysql:8
    container_name: stocksage-mysql
    restart: unless-stopped
    ports:
      - "${STOCKSAGE_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${STOCKSAGE_DB_PASSWORD:-12345}"
      MYSQL_DATABASE: stocksage
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 注意：不挂载 init.sql。schema 由后端 Flyway 在首次启动时自动建立
    # （V1__baseline_schema.sql），保证容器库与手工库走同一条迁移路径。
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: stocksage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: stocksage-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama
    container_name: stocksage-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${STOCKSAGE_EMBEDDING_OLLAMA_MODEL:-bge-m3}"]

volumes:
  mysql-data:
  redis-data:
  ollama-data:
