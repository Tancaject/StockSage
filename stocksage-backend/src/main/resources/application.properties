# ===== Server =====
server.port=8080
spring.application.name=stocksage-backend
spring.config.import=optional:classpath:application-local.properties

# ===== DataSource (MySQL) =====
spring.datasource.url=${STOCKSAGE_DB_URL:jdbc:mysql://localhost:3306/stocksage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${STOCKSAGE_DB_USERNAME:root}
spring.datasource.password=${STOCKSAGE_DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway (schema migrations) =====
# 既有非空库首次启动时在版本 1 处 baseline（V1 即完整当前 schema）；
# 全新空库自动执行 V1 建全。后续 schema 变更放 db/migration/V2__*.sql 起。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===== Redis (short-term memory) =====
spring.data.redis.host=${STOCKSAGE_REDIS_HOST:localhost}
spring.data.redis.port=${STOCKSAGE_REDIS_PORT:6379}
spring.data.redis.password=${STOCKSAGE_REDIS_PASSWORD:}

# ===== Milvus (vector store) =====
spring.ai.vectorstore.type=milvus
spring.ai.vectorstore.milvus.client.host=${STOCKSAGE_MILVUS_HOST:localhost}
spring.ai.vectorstore.milvus.client.port=${STOCKSAGE_MILVUS_PORT:19530}
spring.ai.vectorstore.milvus.database-name=${STOCKSAGE_MILVUS_DATABASE:default}
spring.ai.vectorstore.milvus.collection-name=${STOCKSAGE_MILVUS_COLLECTION:stocksage_docs}
spring.ai.vectorstore.milvus.embedding-dimension=${STOCKSAGE_EMBEDDING_DIMENSION:1024}
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=COSINE
spring.ai.vectorstore.milvus.initialize-schema=${STOCKSAGE_MILVUS_INITIALIZE_SCHEMA:true}

# ===== Spring AI Model Selection =====
# Qwen3.6 is available through Bailian's OpenAI-compatible endpoint (/compatible-mode).
# spring-ai-alibaba 1.1.2.1 calls Bailian's native text-generation endpoint, which returns
# [InvalidParameter] url error for Qwen3.6.
# Chat therefore uses Spring AI's OpenAI client pointed at compatible-mode; rerank still uses spring-ai-alibaba.
spring.ai.model.chat=openai
spring.ai.model.embedding=dashscope
spring.ai.model.rerank=${STOCKSAGE_RERANK_PROVIDER:dashscope}

# ===== Chat: Bailian OpenAI-compatible Endpoint =====
# Reuse spring.ai.dashscope.api-key from application-local.properties so the secret is configured once.
spring.ai.openai.api-key=${spring.ai.dashscope.api-key:}
spring.ai.openai.base-url=${STOCKSAGE_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}

# ===== Rerank / Embedding: Native DashScope Endpoint =====
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
# ===== Chat: DeepSeek official API (optional) =====
# Only the official model names (deepseek-v4-pro, deepseek-flash) and the alias deepseek-v4-pro-0813 are routed here;
# qwen models, the vision model and any other deepseek-* model hosted on Bailian stay on Bailian, as do embedding and rerank.
# Put the key in application-local.properties (stocksage.chat.deepseek.api-key=...); an empty key keeps every chat model on Bailian.
# The key must be a DeepSeek key; startup fails if it equals the DashScope key.
stocksage.chat.deepseek.base-url=${STOCKSAGE_DEEPSEEK_BASE_URL:https://api.deepseek.com}
stocksage.chat.deepseek.api-key=${STOCKSAGE_DEEPSEEK_API_KEY:}
# Thinking depth on the official API: none | low | high | max (Bailian's thinking_budget is translated away).
stocksage.chat.deepseek.reasoning-effort=${STOCKSAGE_DEEPSEEK_REASONING_EFFORT:high}
# The official API has no thinking cap and max_tokens includes thinking, so thinking calls get this larger output cap
# (only raised, never lowered). Billing is per generated token, so the cap itself costs nothing.
stocksage.chat.deepseek.thinking-max-tokens=${STOCKSAGE_DEEPSEEK_THINKING_MAX_TOKENS:49152}
spring.ai.dashscope.rerank.options.model=${STOCKSAGE_RERANK_MODEL:gte-rerank-v2}

# ===== Chat Model Routing =====
# FAST handles short concept questions, Coordinator calls, and query rewrites.
# STANDARD handles regular tool calls and RAG answers.
# STRONG handles deep investment research, valuation, bull/bear tradeoffs, and long-context synthesis.
# Environment overrides take precedence over the role defaults below.
stocksage.chat.model-routing.fast-model=${STOCKSAGE_CHAT_FAST_MODEL:qwen3.8-flash}
stocksage.chat.model-routing.standard-model=${STOCKSAGE_CHAT_STANDARD_MODEL:${STOCKSAGE_CHAT_MODEL:deepseek-flash}}
stocksage.chat.model-routing.strong-model=${STOCKSAGE_CHAT_STRONG_MODEL:deepseek-v4-pro-0813}
stocksage.chat.model-routing.vision-model=${STOCKSAGE_CHAT_VISION_MODEL:qwen3-vl-plus}
stocksage.chat.model-routing.temperature=${STOCKSAGE_CHAT_ROUTING_TEMPERATURE:${STOCKSAGE_CHAT_TEMPERATURE:0.7}}
# Anonymous per-thesis Manager scoring is intentionally low-temperature; Java owns totals and rating thresholds.
stocksage.chat.model-routing.manager-score-temperature=${STOCKSAGE_MANAGER_SCORE_TEMPERATURE:0.0}
# 标准/强模型默认开启思考，百炼的 max_tokens 包含思考内容；上限过低会截断正文 JSON。
stocksage.chat.model-routing.max-output-tokens=${STOCKSAGE_CHAT_ROUTING_MAX_OUTPUT_TOKENS:${STOCKSAGE_CHAT_MAX_OUTPUT_TOKENS:24576}}
# 仅供百炼路线使用；DeepSeek 官方不支持独立思考 token 上限，实际设置见上方 reasoning-effort 和 thinking-max-tokens。
stocksage.chat.model-routing.standard-thinking-budget=${STOCKSAGE_CHAT_THINKING_BUDGET:8192}

# ===== Multi-signal Intent Recognition =====
# LLM is the main semantic signal; embedding starts at 20% and fails open within a short deadline.
# Pattern and character n-gram remain deterministic auxiliary/fallback signals.
stocksage.agent.intent.embedding.enabled=${STOCKSAGE_INTENT_EMBEDDING_ENABLED:true}
stocksage.agent.intent.embedding.timeout-ms=${STOCKSAGE_INTENT_EMBEDDING_TIMEOUT_MS:800}
stocksage.agent.intent.embedding.min-similarity=${STOCKSAGE_INTENT_EMBEDDING_MIN_SIMILARITY:0.55}
stocksage.agent.intent.embedding.min-margin=${STOCKSAGE_INTENT_EMBEDDING_MIN_MARGIN:0.03}

# Offline demo samples keep the Workbench cockpit and fallback report path visible after clone
# even when live market, SEC, and DashScope credentials are not configured.
stocksage.demo.offline-sample.enabled=${STOCKSAGE_DEMO_OFFLINE_SAMPLE_ENABLED:true}
stocksage.demo.offline-sample.path=${STOCKSAGE_DEMO_OFFLINE_SAMPLE_PATH:demo/offline-stock-samples.json}
stocksage.chat.multimodal.enabled=${STOCKSAGE_CHAT_MULTIMODAL_ENABLED:true}
stocksage.chat.multimodal.max-images=${STOCKSAGE_CHAT_MULTIMODAL_MAX_IMAGES:4}
stocksage.chat.multimodal.max-image-bytes=${STOCKSAGE_CHAT_MULTIMODAL_MAX_IMAGE_BYTES:5242880}
stocksage.chat.title-generation.enabled=${STOCKSAGE_CHAT_TITLE_GENERATION_ENABLED:true}

# ===== Embedding Provider =====
# ollama: local Ollama + bge-m3 (default, zero cost)
# dashscope: DashScope text-embedding-v4 (requires API quota)
stocksage.embedding.provider=${STOCKSAGE_EMBEDDING_PROVIDER:ollama}
stocksage.embedding.ollama.base-url=${STOCKSAGE_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
stocksage.embedding.ollama.model=${STOCKSAGE_EMBEDDING_OLLAMA_MODEL:bge-m3}
stocksage.embedding.ollama.timeout-ms=${STOCKSAGE_EMBEDDING_OLLAMA_TIMEOUT_MS:120000}
# Process-local Ollama HTTP concurrency; DashScope embedding uses its own client.
stocksage.embedding.ollama.max-concurrent-calls=${STOCKSAGE_EMBEDDING_OLLAMA_MAX_CONCURRENT_CALLS:2}

# ===== Session / Security =====
server.servlet.session.timeout=${STOCKSAGE_SESSION_TIMEOUT:7d}
server.servlet.session.cookie.max-age=${STOCKSAGE_SESSION_COOKIE_MAX_AGE:7d}

# ===== App Custom Config =====
stocksage.admin.enabled=${STOCKSAGE_ADMIN_ENABLED:true}
stocksage.admin.header-name=${STOCKSAGE_ADMIN_HEADER_NAME:X-StockSage-Admin-Token}
stocksage.admin.token=${STOCKSAGE_ADMIN_TOKEN:}
stocksage.data-service.base-url=${STOCKSAGE_DATA_SERVICE_BASE_URL:http://localhost:8001}
stocksage.data-service.timeout-ms=${STOCKSAGE_DATA_SERVICE_TIMEOUT_MS:10000}
stocksage.data-service.financial-report-timeout-ms=${STOCKSAGE_DATA_SERVICE_FINANCIAL_REPORT_TIMEOUT_MS:30000}
stocksage.data-service.edgar-timeout-ms=${STOCKSAGE_DATA_SERVICE_EDGAR_TIMEOUT_MS:120000}
stocksage.data-service.max-in-memory-mb=${STOCKSAGE_DATA_SERVICE_MAX_IN_MEMORY_MB:64}
stocksage.memory.short-term-ttl-hours=${STOCKSAGE_MEMORY_TTL_HOURS:24}
stocksage.memory.max-context-messages=${STOCKSAGE_MEMORY_MAX_CONTEXT_MESSAGES:20}
stocksage.memory.llm-summary.enabled=${STOCKSAGE_MEMORY_LLM_SUMMARY_ENABLED:true}
stocksage.memory.llm-profile.enabled=${STOCKSAGE_MEMORY_LLM_PROFILE_ENABLED:true}
stocksage.memory.long-term.risk-half-life-days=${STOCKSAGE_MEMORY_RISK_HALF_LIFE_DAYS:180}
stocksage.memory.long-term.summary-half-life-days=${STOCKSAGE_MEMORY_SUMMARY_HALF_LIFE_DAYS:90}
stocksage.memory.long-term.min-weight=${STOCKSAGE_MEMORY_MIN_WEIGHT:0.25}
stocksage.rag.top-k=${STOCKSAGE_RAG_TOP_K:10}
stocksage.rag.similarity-threshold=${STOCKSAGE_RAG_SIMILARITY_THRESHOLD:0.5}
stocksage.rag.dedup-similarity-threshold=${STOCKSAGE_RAG_DEDUP_SIMILARITY_THRESHOLD:0.85}
stocksage.rag.rewrite-query=${STOCKSAGE_RAG_REWRITE_QUERY:true}
stocksage.rag.rewrite-query.max-length=${STOCKSAGE_RAG_REWRITE_QUERY_MAX_LENGTH:180}
stocksage.rag.edgar.parent-chunk-size=${STOCKSAGE_RAG_EDGAR_PARENT_CHUNK_SIZE:3000}
stocksage.rag.edgar.parent-chunk-overlap=${STOCKSAGE_RAG_EDGAR_PARENT_CHUNK_OVERLAP:300}
stocksage.rag.edgar.child-chunk-size=${STOCKSAGE_RAG_EDGAR_CHILD_CHUNK_SIZE:800}
stocksage.rag.edgar.child-chunk-overlap=${STOCKSAGE_RAG_EDGAR_CHILD_CHUNK_OVERLAP:120}
stocksage.rag.edgar.chunking-version=${STOCKSAGE_RAG_EDGAR_CHUNKING_VERSION:edgar-v4-contextual-gist-child-vector}
stocksage.rag.rerank.enabled=${STOCKSAGE_RAG_RERANK_ENABLED:true}
stocksage.rag.rerank.model=${STOCKSAGE_RAG_RERANK_MODEL:gte-rerank-v2}
stocksage.rag.rerank.max-concurrent-calls=${STOCKSAGE_RAG_RERANK_MAX_CONCURRENT_CALLS:2}
stocksage.rag.rerank.candidate-top-k=${STOCKSAGE_RAG_RERANK_CANDIDATE_TOP_K:20}
stocksage.rag.hybrid-search.enabled=${STOCKSAGE_RAG_HYBRID_SEARCH_ENABLED:true}
stocksage.rag.hybrid-search.keyword-top-k=${STOCKSAGE_RAG_HYBRID_SEARCH_KEYWORD_TOP_K:10}
stocksage.rag.hybrid-search.rrf-k=${STOCKSAGE_RAG_HYBRID_SEARCH_RRF_K:60}
stocksage.rag.hybrid-search.bm25.k1=${STOCKSAGE_RAG_HYBRID_SEARCH_BM25_K1:1.2}
stocksage.rag.hybrid-search.bm25.b=${STOCKSAGE_RAG_HYBRID_SEARCH_BM25_B:0.75}
stocksage.rag.metadata-filter.enabled=${STOCKSAGE_RAG_METADATA_FILTER_ENABLED:true}
stocksage.rag.docs-path=${STOCKSAGE_RAG_DOCS_PATH:docs}
stocksage.rag.scheduler-zone=${STOCKSAGE_RAG_SCHEDULER_ZONE:Asia/Shanghai}
stocksage.rag.ttl-cleanup-cron=${STOCKSAGE_RAG_TTL_CLEANUP_CRON:0 15 * * * *}

stocksage.chat.tool-prefetch.max-search-results=${STOCKSAGE_CHAT_TOOL_PREFETCH_MAX_SEARCH_RESULTS:5}
stocksage.chat.tool-prefetch.per-tool-timeout-seconds=${STOCKSAGE_CHAT_TOOL_PREFETCH_PER_TOOL_TIMEOUT_SECONDS:8}
stocksage.chat.prompt.max-text-chars=${STOCKSAGE_CHAT_PROMPT_MAX_TEXT_CHARS:60000}
stocksage.chat.prompt.rag-max-chars=${STOCKSAGE_CHAT_PROMPT_RAG_MAX_CHARS:32000}
stocksage.chat.prompt.history-max-chars=${STOCKSAGE_CHAT_PROMPT_HISTORY_MAX_CHARS:9000}
stocksage.chat.search-ingest.enabled=${STOCKSAGE_CHAT_SEARCH_INGEST_ENABLED:true}
stocksage.chat.search-ingest.ttl-days=${STOCKSAGE_CHAT_SEARCH_INGEST_TTL_DAYS:7}
stocksage.agent.prefetch.timeout-seconds=${STOCKSAGE_AGENT_PREFETCH_TIMEOUT_SECONDS:180}
# DEEP 取证循环（有界 ReAct，docs/architecture/deep-react-plan.md）。M5 达默认开启门槛后默认开启（2026-10-13）。
stocksage.agent.deep-react.enabled=${STOCKSAGE_AGENT_DEEP_REACT_ENABLED:true}
stocksage.agent.deep-react.max-rounds=5
stocksage.agent.deep-react.max-tool-calls=8
stocksage.agent.deep-react.max-parallel-calls=2
stocksage.agent.deep-react.stagnation-rounds=3
stocksage.agent.deep-react.time-budget-ms=240000
stocksage.agent.deep-react.reserved-run-ms=900000
stocksage.agent.deep-react.reserved-model-calls=16
# 研究任务租约与崩溃接管：心跳每 60 秒（TTL/3，上限 60 秒），TTL 3 分钟可容忍丢 2 次心跳；
# 停滞判定与 TTL 一致、每分钟扫描，崩溃后约 4 分钟内被接管。双写由租约 token + attempts 的 fencing 兜底。
stocksage.research-task.lease-ttl-ms=${STOCKSAGE_RESEARCH_TASK_LEASE_TTL_MS:180000}
stocksage.research-task.stale-after-minutes=${STOCKSAGE_RESEARCH_TASK_STALE_AFTER_MINUTES:3}
stocksage.research-task.recovery-cron=${STOCKSAGE_RESEARCH_TASK_RECOVERY_CRON:0 * * * * *}
# Frozen per research run, including queue time and retries; an operating policy, not an SLO.
# Sized for up to 8 debate rounds: ~6 evidence-loop calls + 8 x (Bull, Bear, continuation) + scoring/report with
# one repair each + transient retries and one cancelled speculative round, with headroom for the scoring comparison.
stocksage.research.budget.timeout-ms=${STOCKSAGE_RESEARCH_BUDGET_TIMEOUT_MS:2700000}
stocksage.research.budget.max-model-calls=${STOCKSAGE_RESEARCH_BUDGET_MAX_MODEL_CALLS:52}
# Keep synchronous SDK retries from multiplying one recorded model invocation.
spring.ai.retry.max-attempts=1
# Process-local admission policy for all chat clients; not a latency or throughput SLO.
stocksage.chat.max-concurrent-calls=${STOCKSAGE_CHAT_MAX_CONCURRENT_CALLS:8}
# Server-owned safety cap only. From round 3 a round citing no new evidence stops deterministically; otherwise
# Research Manager decides CONTINUE or STOP. This value is neither a default debate length nor a fallback.
stocksage.agent.debate.max-rounds=${STOCKSAGE_AGENT_DEBATE_MAX_ROUNDS:8}
# SINGLE scores all theses in one call; COMPARE also scores Position A/B in two parallel calls and only records
# the comparison in the trace (evaluation use).
stocksage.agent.debate.scoring-mode=${STOCKSAGE_AGENT_DEBATE_SCORING_MODE:SINGLE}
# Optional reasoning_effort override (none/low/high/max) for Bull/Bear and scoring on the DeepSeek route; empty keeps
# stocksage.chat.deepseek.reasoning-effort. For evaluation comparisons.
stocksage.agent.debate.reasoning-effort=${STOCKSAGE_AGENT_DEBATE_REASONING_EFFORT:}
# Outer deadline for one Bull/Bear round, one Manager continuation decision, or one synthesis. It protects worker capacity
# when a streaming provider connection never completes after host/network interruption.
stocksage.agent.debate.model-stage-timeout-ms=${STOCKSAGE_AGENT_DEBATE_MODEL_STAGE_TIMEOUT_MS:300000}
stocksage.agent.routing.temperature=${STOCKSAGE_AGENT_ROUTING_TEMPERATURE:0.1}
stocksage.agent.routing.max-output-tokens=${STOCKSAGE_AGENT_ROUTING_MAX_OUTPUT_TOKENS:1024}
# 普通路线 P&E：多标的扇出与计划来源分开控制，便于分别验证（见 docs/architecture/ordinary-plan-and-execute-plan.md）。
# 基本面方法 skill（resources/skills/methods）：按问题主题标签追加专项方法；关闭后回到基线方法。
stocksage.fundamentals.skills.enabled=${STOCKSAGE_FUNDAMENTALS_SKILLS_ENABLED:true}
stocksage.agent.ordinary.multi-target.enabled=${STOCKSAGE_ORDINARY_MULTI_TARGET_ENABLED:false}
stocksage.agent.ordinary.multi-target.max-targets=${STOCKSAGE_ORDINARY_MULTI_TARGET_MAX:4}
stocksage.agent.ordinary.multi-target.timeout-seconds=${STOCKSAGE_ORDINARY_MULTI_TARGET_TIMEOUT_SECONDS:45}
stocksage.agent.ordinary.multi-target.pool-size=${STOCKSAGE_ORDINARY_MULTI_TARGET_POOL_SIZE:8}
stocksage.agent.ordinary.multi-target.queue-capacity=${STOCKSAGE_ORDINARY_MULTI_TARGET_QUEUE_CAPACITY:16}
stocksage.agent.ordinary.planner.mode=${STOCKSAGE_ORDINARY_PLANNER_MODE:FIXED}
stocksage.agent.ordinary.planner.timeout-ms=${STOCKSAGE_ORDINARY_PLANNER_TIMEOUT_MS:20000}

# ===== Spring MVC async streaming =====
# Keep blocking Servlet response writes isolated from agent and research worker execution.
stocksage.mvc.async.core-pool-size=${STOCKSAGE_MVC_ASYNC_CORE_POOL_SIZE:4}
stocksage.mvc.async.max-pool-size=${STOCKSAGE_MVC_ASYNC_MAX_POOL_SIZE:16}
stocksage.mvc.async.queue-capacity=${STOCKSAGE_MVC_ASYNC_QUEUE_CAPACITY:32}
stocksage.mvc.async.timeout-ms=${STOCKSAGE_MVC_ASYNC_TIMEOUT_MS:1800000}
stocksage.agent.queue-capacity=${STOCKSAGE_AGENT_QUEUE_CAPACITY:32}
stocksage.background.queue-capacity=${STOCKSAGE_BACKGROUND_QUEUE_CAPACITY:16}

# ===== Skills =====
stocksage.skills.defaults.news=${STOCKSAGE_DEFAULT_NEWS_SKILL:local-latest-news}

# ===== Sourced cross-session research memory =====
# Time decay and conflict resolution are active by default. Environment variables remain kill switches.
stocksage.research-memory.capture=${STOCKSAGE_RESEARCH_MEMORY_CAPTURE:true}
stocksage.research-memory.index=${STOCKSAGE_RESEARCH_MEMORY_INDEX:true}
stocksage.research-memory.retrieve=${STOCKSAGE_RESEARCH_MEMORY_RETRIEVE:true}
stocksage.research-memory.inject=${STOCKSAGE_RESEARCH_MEMORY_INJECT:true}
stocksage.research-memory.collection-name=${STOCKSAGE_RESEARCH_MEMORY_COLLECTION:stocksage_user_research_memory_v1}
stocksage.research-memory.candidate-k=${STOCKSAGE_RESEARCH_MEMORY_CANDIDATE_K:30}
stocksage.research-memory.shortlist-k=${STOCKSAGE_RESEARCH_MEMORY_SHORTLIST_K:12}
stocksage.research-memory.brief-top-k=${STOCKSAGE_RESEARCH_MEMORY_BRIEF_TOP_K:4}
stocksage.research-memory.top-k=${STOCKSAGE_RESEARCH_MEMORY_TOP_K:6}
stocksage.research-memory.deep-top-k=${STOCKSAGE_RESEARCH_MEMORY_DEEP_TOP_K:8}
stocksage.research-memory.max-prompt-chars=${STOCKSAGE_RESEARCH_MEMORY_MAX_PROMPT_CHARS:4800}
stocksage.research-memory.decay-half-life-days=${STOCKSAGE_RESEARCH_MEMORY_DECAY_HALF_LIFE_DAYS:90}
stocksage.research-memory.min-effective-score=${STOCKSAGE_RESEARCH_MEMORY_MIN_EFFECTIVE_SCORE:0.0}
stocksage.research-memory.compensation-delay-ms=${STOCKSAGE_RESEARCH_MEMORY_COMPENSATION_DELAY_MS:60000}
stocksage.research-memory.compensation-initial-delay-ms=${STOCKSAGE_RESEARCH_MEMORY_COMPENSATION_INITIAL_DELAY_MS:60000}

# ===== IBKR Client Portal Web API (read-only) =====
# Start Client Portal Gateway first, then open https://localhost:5000 and log in.
# Keep disabled by default so the app still starts without IBKR.
stocksage.ibkr.enabled=${STOCKSAGE_IBKR_ENABLED:false}
stocksage.ibkr.base-url=${STOCKSAGE_IBKR_BASE_URL:https://localhost:5000/v1/api}
stocksage.ibkr.timeout-ms=${STOCKSAGE_IBKR_TIMEOUT_MS:10000}
stocksage.ibkr.insecure-ssl=${STOCKSAGE_IBKR_INSECURE_SSL:true}
stocksage.ibkr.keepalive-enabled=${STOCKSAGE_IBKR_KEEPALIVE_ENABLED:true}
stocksage.ibkr.keepalive-interval-ms=${STOCKSAGE_IBKR_KEEPALIVE_INTERVAL_MS:30000}
stocksage.ibkr.keepalive-initial-delay-ms=${STOCKSAGE_IBKR_KEEPALIVE_INITIAL_DELAY_MS:15000}

# ===== FUNDAMENTALS method evolution =====
# 已批准方法包（evals/evolution_release.py --mode approve 输出的 approved-method.json）及其 sha256。
stocksage.evolution.fundamentals.approved-artifact=${STOCKSAGE_EVOLUTION_APPROVED_ARTIFACT:}
stocksage.evolution.fundamentals.approved-artifact-sha256=${STOCKSAGE_EVOLUTION_APPROVED_ARTIFACT_SHA256:}
stocksage.evolution.fundamentals.revoked-bundle-ids=${STOCKSAGE_EVOLUTION_REVOKED_BUNDLE_IDS:}
# 灰度：OFF 只用基线；ALLOWLIST 只对 rollout-accounts 中的用户 ID 启用；ALL 全量。非 OFF 时必须配置控制目录。
stocksage.evolution.fundamentals.rollout=${STOCKSAGE_EVOLUTION_ROLLOUT:OFF}
stocksage.evolution.fundamentals.rollout-accounts=${STOCKSAGE_EVOLUTION_ROLLOUT_ACCOUNTS:}
# 控制目录：放入 STABLE_ONLY 或 REVOKE.<bundleId> 空文件即可免重启回到基线。
stocksage.evolution.control-directory=${STOCKSAGE_EVOLUTION_CONTROL_DIRECTORY:}

# ===== Logging =====
# 默认 INFO：DEBUG 会把提示词与用户内容写进日志，仅排障时用环境变量临时打开。
logging.level.com.stocksage=${STOCKSAGE_LOG_LEVEL:INFO}
logging.level.org.springframework.ai=${STOCKSAGE_SPRING_AI_LOG_LEVEL:INFO}
