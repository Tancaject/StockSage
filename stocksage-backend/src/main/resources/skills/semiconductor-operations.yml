{
  "id": "semiconductor-operations",
  "version": 1,
  "displayName": "半导体经营指标",
  "enabled": true,
  "routes": [
    "FUNDAMENTALS"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
    "maxCapabilityCalls": 1,
    "maxDurationSeconds": 120
  },
  "steps": [
    {
      "type": "TOOL",
      "capability": "getSemiconductorOperatingMetrics",
      "required": true,
      "arguments": {
        "ticker": "$input.ticker",
        "period": "$input.period",
        "years": "$input.years",
        "asOf": "$input.asOf"
      }
    }
  ],
  "fallbackSkillIds": [],
  "inputs": {
    "ticker": "NVDA",
    "period": "annual",
    "years": 5,
    "asOf": ""
  },
  "method": "将库存、成本和营运变化与产品结构、产能、客户需求原文结合。标准XBRL未覆盖的订单、分部、产能、利用率必须列为缺口，不从总营收推算。"
}
