{
  "id": "historical-research-index",
  "version": 1,
  "displayName": "历史研究检索",
  "enabled": true,
  "routes": [
    "DEEP"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
    "maxCapabilityCalls": 1,
    "maxDurationSeconds": 120
  },
  "steps": [
    {
      "type": "TOOL",
      "capability": "listResearchHistory",
      "required": true,
      "arguments": {
        "ticker": "$input.ticker",
        "asOf": "$input.asOf",
        "limit": "$input.limit"
      }
    }
  ],
  "fallbackSkillIds": [],
  "inputs": {
    "ticker": "NVDA",
    "asOf": "",
    "limit": 20
  },
  "method": "按本人存档时间查找历史报告，使用返回的reportId/snapshotId继续读取原文。历史结论和人工复核状态均以asOf为界，不替代当前证据。"
}
