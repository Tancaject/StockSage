{
  "id": "peer-comparison",
  "version": 1,
  "displayName": "同口径公司比较",
  "enabled": true,
  "routes": [
    "FUNDAMENTALS"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
    "maxCapabilityCalls": 1,
    "maxDurationSeconds": 120
  },
  "steps": [
    {
      "type": "TOOL",
      "capability": "compareCompanyFinancials",
      "required": true,
      "arguments": {
        "tickerA": "$input.tickerA",
        "tickerB": "$input.tickerB",
        "period": "$input.period",
        "years": "$input.years",
        "asOf": "$input.asOf"
      }
    }
  ],
  "fallbackSkillIds": [],
  "inputs": {
    "tickerA": "NVDA",
    "tickerB": "AMD",
    "period": "annual",
    "years": 3,
    "asOf": ""
  },
  "method": "只比较工具标为可比的期间、币种和财务口径；不同财年截止日保留提示。没有对齐的数据留空，不给机械排名。"
}
