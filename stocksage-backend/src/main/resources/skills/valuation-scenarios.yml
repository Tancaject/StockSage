{
  "id": "valuation-scenarios",
  "version": 1,
  "displayName": "估值情景",
  "enabled": true,
  "routes": [
    "FUNDAMENTALS"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
