{
  "id": "historical-financial-review",
  "version": 1,
  "displayName": "历史时点财务复盘",
  "enabled": true,
  "routes": [
    "DEEP"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
    "maxCapabilityCalls": 1,
    "maxDurationSeconds": 120
  },
  "steps": [
    {
      "type": "TOOL",
      "capability": "getHistoricalFinancials",
      "required": true,
      "arguments": {
        "ticker": "$input.ticker",
        "period": "$input.period",
        "years": "$input.years",
        "asOf": "$input.asOf"
      }
    }
  ],
  "fallbackSkillIds": [],
  "inputs": {
    "ticker": "NVDA",
    "period": "annual",
    "years": 5,
    "asOf": "2026-10-01"
  },
  "method": "所有可用事实必须满足披露日期不晚于asOf；区分财年结束、披露和抓取时间。历史更正也按当时已披露版本取值，不能用今天的数据回填当时结论。"
}
