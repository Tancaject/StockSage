{
  "id": "event-window-review",
  "version": 1,
  "displayName": "事件窗口历史复盘",
  "enabled": true,
  "routes": [
    "DEEP"
  ],
  "executionMode": "INLINE_DETERMINISTIC",
  "minimumModelTier": "STANDARD",
  "policy": {
    "allowedRiskLevels": [
      "READ_ONLY"
    ],
    "maxCapabilityCalls": 1,
    "maxDurationSeconds": 120
  },
  "steps": [
    {
      "type": "TOOL",
      "capability": "getEventWindowReturns",
      "required": true,
      "arguments": {
        "code": "$input.code",
        "benchmarkCode": "$input.benchmarkCode",
        "eventAt": "$input.eventAt",
        "beforeBars": "$input.beforeBars",
        "afterBars": "$input.afterBars",
        "period": "$input.period"
      }
    }
  ],
  "fallbackSkillIds": [],
  "inputs": {
    "code": "NVDA",
    "benchmarkCode": "SPY",
    "eventAt": "2026-10-01T12:00:00-04:00",
    "beforeBars": 5,
    "afterBars": 5,
    "period": "1y"
  },
  "method": "围绕实际交易日对齐事件和基准，展示覆盖窗口、收益、基准差和公式。注明行情调整口径及交易日对齐限制；历史窗口不是可交易收益或因果结论。"
}
